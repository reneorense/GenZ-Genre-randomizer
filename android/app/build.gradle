plugins { id 'com.android.application' }
android {
    namespace 'com.renafterhours.sonicvault'
    compileSdk 35
    defaultConfig {
        applicationId 'com.renafterhours.sonicvault'
        minSdk 26
        targetSdk 34
        versionCode 401
        versionName '4.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/webAssets'))
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
def bundleWeb = tasks.register('bundleWeb', Sync) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'src/**', 'public/**'
    }
    into(layout.buildDirectory.dir('generated/webAssets'))
}
tasks.named('preBuild').configure { dependsOn(bundleWeb) }
